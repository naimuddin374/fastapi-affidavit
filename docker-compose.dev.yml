version: "3.8"

services:
  ######################################
  # 1. API SERVICE (FastAPI Application)
  ######################################
  api-server:
    # Build configuration (assuming you have a Dockerfile.dev for development)
    build:
      context: .
      dockerfile: Dockerfile.dev

    # Mounts local code for hot reloading
    volumes:
      - .:/app

    # Environment variables for the web service
    environment:
      - DEBUG=True
      - PORT=8000
      # CRITICAL: Define the DB connection string for the FastAPI app
      # The host name must be the service name: 'db'
      - DATABASE_URL=postgresql://admin:pass1234@db:5432/affidavit-map-db

    # Map container port to host port
    ports:
      - "8000:8000"

    # Command to run the development server with hot-reloading
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

    # NEW: Ensure the DB service is fully up and running before starting the web service
